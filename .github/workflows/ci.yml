name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Fin
        run: |
          curl -fsSL https://raw.githubusercontent.com/M1778/Fin/master/install.sh | sh

      - name: Build
        run: finc src/main.fin

      - name: Test
        run: |
          finc tests/test_main.fin -o test_runner
          ./test_runner
